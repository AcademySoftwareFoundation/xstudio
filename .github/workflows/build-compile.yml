name: Build compile check

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  compile:
    name: compile (${{ matrix.deps_tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe_deps: ubuntu24-deps
            recipe_compile: ubuntu24-compile
            deps_tag: ubuntu2404
          - recipe_deps: rocky9-deps
            recipe_compile: rocky9-compile
            deps_tag: rocky9

    env:
      JOBS: "2"
      STUDIO_PLUGINS: ""
      BMD_DECKLINK: "OFF"
      PUSH_DEPS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Image name (lowercase)
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "DEPS_IMAGE=ghcr.io/${repo}/xstudio-deps:${{ matrix.deps_tag }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dependency image
        working-directory: ci/linux
        run: just ${{ matrix.recipe_deps }}

      - name: Compile xSTUDIO
        working-directory: ci/linux
        run: just ${{ matrix.recipe_compile }}
