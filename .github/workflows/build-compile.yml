name: Build compile check

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  compile-linux:
    name: compile (${{ matrix.deps_tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe_compile: ubuntu24-compile
            deps_tag: ubuntu2404
          - recipe_compile: rocky9-compile
            deps_tag: rocky9

    env:
      JOBS: "2"
      STUDIO_PLUGINS: ""
      BMD_DECKLINK: "OFF"
      PUSH_DEPS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Image name (lowercase)
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "DEPS_IMAGE=ghcr.io/${repo}/xstudio-deps:${{ matrix.deps_tag }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `_compile` already depends on `_deps` (registry + GHA BuildKit cache).
      - name: Build deps image and compile xSTUDIO
        working-directory: ci/linux
        run: just ${{ matrix.recipe_compile }}

  compile-macos:
    name: compile (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      JOBS: "3"
      QT_ROOT: ${{ github.workspace }}/.ci-cache/Qt
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      # Binary package cache for vcpkg ports (ffmpeg, OIIO, …).
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable GitHub Actions cache backend for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Read Qt version pin
        id: pins
        run: |
          # shellcheck source=ci/macos/versions.env
          source ci/macos/versions.env
          echo "qt_version=${QT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Qt SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ steps.pins.outputs.qt_version }}-mac-clang64-imageformats-pdf

      - name: Compile xSTUDIO
        run: bash ci/macos/build.sh
