name: build Check

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  SCCACHE_VERSION: v0.19.0

jobs:
  build-linux:
    name: Build (${{ matrix.deps_tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - deps_tag: ubuntu2404
            deps_file: ci/linux/dockerfiles/ubuntu2404.deps.Dockerfile
          - deps_tag: rocky9
            deps_file: ci/linux/dockerfiles/rocky9.deps.Dockerfile

    env:
      JOBS: "4"
      STUDIO_PLUGINS: ""
      BMD_DECKLINK: "OFF"
      BUILD_TESTING: "OFF"
      SCCACHE_DIR: ${{ github.workspace }}/.ci-cache/sccache
      SCCACHE_BIN_DIR: ${{ github.workspace }}/.ci-cache/sccache-bin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GHCR deps image
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "DEPS_IMAGE=ghcr.io/${repo}/xstudio-deps:${{ matrix.deps_tag }}" >> "$GITHUB_ENV"
          echo "DEPS_CACHE=ghcr.io/${repo}/xstudio-deps:${{ matrix.deps_tag }}-buildcache" >> "$GITHUB_ENV"

      - name: Export version pins to job env
        run: grep -vE '^\s*(#|$)' ci/linux/versions.env >> "$GITHUB_ENV"

      - name: Build deps image
        uses: docker/build-push-action@v6
        with:
          context: ci/linux
          file: ${{ matrix.deps_file }}
          push: true
          tags: ${{ env.DEPS_IMAGE }}
          cache-from: type=registry,ref=${{ env.DEPS_CACHE }}
          cache-to: type=registry,ref=${{ env.DEPS_CACHE }},mode=max
          build-args: |
            JOBS=${{ env.JOBS }}
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            NINJA_VERSION=${{ env.NINJA_VERSION }}
            PYBIND11_VERSION=${{ env.PYBIND11_VERSION }}
            AQTINSTALL_VERSION=${{ env.AQTINSTALL_VERSION }}
            QT_VERSION=${{ env.QT_VERSION }}
            OPENEXR_REF=${{ env.OPENEXR_REF }}
            CAF_VERSION=${{ env.CAF_VERSION }}
            OCIO_VERSION=${{ env.OCIO_VERSION }}
            OTIO_REF=${{ env.OTIO_REF }}
            FILESEQ_CPP_REF=${{ env.FILESEQ_CPP_REF }}
            FFMPEG_VERSION=${{ env.FFMPEG_VERSION }}
            OIIO_VERSION=${{ env.OIIO_VERSION }}
            LIBRAW_VERSION=${{ env.LIBRAW_VERSION }}
            LIBDE265_VERSION=${{ env.LIBDE265_VERSION }}
            LIBHEIF_VERSION=${{ env.LIBHEIF_VERSION }}
            EXIV2_VERSION=${{ env.EXIV2_VERSION }}
            GLEW_VERSION=${{ env.GLEW_VERSION }}
            JSON_VERSION=${{ env.JSON_VERSION }}
            SPDLOG_VERSION=${{ env.SPDLOG_VERSION }}
            FMT_VERSION=${{ env.FMT_VERSION }}
            LIBJPEGTURBO_VERSION=${{ env.LIBJPEGTURBO_VERSION }}
            X264_REF=${{ env.X264_REF }}
            X265_VERSION=${{ env.X265_VERSION }}
            FDKAAC_REF=${{ env.FDKAAC_REF }}
            NASM_VERSION=${{ env.NASM_VERSION }}

      - name: Install sccache
        env:
          DEST_DIR: ${{ env.SCCACHE_BIN_DIR }}
        run: bash ci/scripts/install-sccache.sh

      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ matrix.deps_tag }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.deps_tag }}-${{ github.ref_name }}-

      - name: Build xSTUDIO
        env:
          DEPS_TAG: ${{ matrix.deps_tag }}
        run: bash ci/linux/scripts/run-build-container.sh

      - name: sccache stats
        if: always()
        # Build runs sccache inside Docker; dump is written for this step (host --show-stats would be empty).
        run: |
          if [ -f .ci-cache/sccache-show-stats.txt ]; then
            cat .ci-cache/sccache-show-stats.txt
          else
            echo "No sccache stats file (build container did not write .ci-cache/sccache-show-stats.txt)"
            exit 1
          fi

  build-macos:
    name: Build (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      JOBS: "4"
      BUILD_TESTING: "OFF"
      # Qt must live outside the source tree: CMake rejects INTERFACE includes under CMAKE_SOURCE_DIR.
      QT_ROOT: ${{ github.workspace }}/../.ci-cache/Qt
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
      SCCACHE_DIR: ${{ github.workspace }}/.ci-cache/sccache
      SCCACHE_BIN_DIR: ${{ github.workspace }}/.ci-cache/sccache-bin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read Qt version for cache key
        id: pins
        run: |
          # shellcheck source=ci/macos/versions.env
          source ci/macos/versions.env
          echo "qt_version=${QT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore Qt SDK cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ steps.pins.outputs.qt_version }}-mac-clang64-imageformats-pdf

      - name: Bootstrap vcpkg
        run: |
          baseline="$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")"
          if [ ! -d "${VCPKG_ROOT}/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          else
            git -C "${VCPKG_ROOT}" fetch origin
          fi
          git -C "${VCPKG_ROOT}" checkout --force "${baseline}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Setup NuGet credentials
        env:
          FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          NUGET_OWNER: ${{ github.repository_owner }}
        run: |
          brew list mono &>/dev/null || brew install mono
          nuget="$(${VCPKG_ROOT}/vcpkg fetch nuget | tail -n 1)"
          mono "${nuget}" sources add \
            -Source "${FEED_URL}" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${NUGET_OWNER}" \
            -Password "${{ secrets.GITHUB_TOKEN }}" \
            || mono "${nuget}" sources update \
              -Source "${FEED_URL}" \
              -StorePasswordInClearText \
              -Name GitHubPackages \
              -UserName "${NUGET_OWNER}" \
              -Password "${{ secrets.GITHUB_TOKEN }}"
          mono "${nuget}" setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "${FEED_URL}"

      - name: Install sccache
        env:
          DEST_DIR: ${{ env.SCCACHE_BIN_DIR }}
        run: bash ci/scripts/install-sccache.sh

      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Build deps
        run: bash ci/macos/scripts/build-deps.sh

      - name: Build xSTUDIO
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ env.SCCACHE_BIN_DIR }}/sccache
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ env.SCCACHE_BIN_DIR }}/sccache
        run: bash ci/macos/scripts/build-xstudio.sh

      - name: sccache stats
        if: always()
        run: ${{ env.SCCACHE_BIN_DIR }}/sccache --show-stats

  build-windows:
    name: Build (windows-x64)
    # windows-2022 = VS 2022 (matches ASWF docs). windows-latest is VS 2026 / MSVC 14.51,
    # which breaks Qt 6.5.3 (removed stdext::checked_array_iterator).
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      JOBS: "4"
      BUILD_TESTING: "OFF"
      # Qt must live outside the source tree: CMake rejects INTERFACE includes under CMAKE_SOURCE_DIR.
      QT_ROOT: ${{ github.workspace }}/../.ci-cache/Qt
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
      SCCACHE_DIR: ${{ github.workspace }}/.ci-cache/sccache
      SCCACHE_BIN_DIR: ${{ github.workspace }}/.ci-cache/sccache-bin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Read Qt version for cache key
        id: pins
        shell: pwsh
        run: |
          Get-Content ci/windows/versions.env | ForEach-Object {
            $line = $_.Trim()
            if (-not $line -or $line.StartsWith('#')) { return }
            $eq = $line.IndexOf('=')
            if ($eq -lt 1) { return }
            $name = $line.Substring(0, $eq).Trim()
            $value = $line.Substring($eq + 1).Trim()
            if ($name -eq 'QT_VERSION') {
              "qt_version=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          }

      - name: Restore Qt SDK cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ steps.pins.outputs.qt_version }}-win-msvc2019_64-imageformats-pdf

      # Before msvc-dev-cmd: that action overwrites VCPKG_ROOT with the VS-bundled copy.
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if (-not (Test-Path -LiteralPath (Join-Path $env:VCPKG_ROOT '.git'))) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            if ($LASTEXITCODE -ne 0) { throw "git clone failed ($LASTEXITCODE)" }
          } else {
            git -C $env:VCPKG_ROOT fetch origin
            if ($LASTEXITCODE -ne 0) { throw "git fetch failed ($LASTEXITCODE)" }
          }
          git -C $env:VCPKG_ROOT checkout --force $baseline
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed ($LASTEXITCODE)" }
          $bootstrap = Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat'
          cmd.exe /c "`"$bootstrap`" -disableMetrics"
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed ($LASTEXITCODE)" }

      - name: Setup NuGet credentials
        shell: pwsh
        env:
          FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          NUGET_OWNER: ${{ github.repository_owner }}
        run: |
          $vcpkg = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          $nuget = (& $vcpkg fetch nuget | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "vcpkg fetch nuget failed ($LASTEXITCODE)" }
          & $nuget sources add `
            -Source $env:FEED_URL `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName $env:NUGET_OWNER `
            -Password '${{ secrets.GITHUB_TOKEN }}'
          if ($LASTEXITCODE -ne 0) {
            & $nuget sources update `
              -Source $env:FEED_URL `
              -StorePasswordInClearText `
              -Name GitHubPackages `
              -UserName $env:NUGET_OWNER `
              -Password '${{ secrets.GITHUB_TOKEN }}'
            if ($LASTEXITCODE -ne 0) { throw "nuget sources update failed ($LASTEXITCODE)" }
          }
          & $nuget setapikey '${{ secrets.GITHUB_TOKEN }}' -Source $env:FEED_URL
          if ($LASTEXITCODE -ne 0) { throw "nuget setapikey failed ($LASTEXITCODE)" }

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install sccache
        shell: pwsh
        run: |
          $version = $env:SCCACHE_VERSION
          $dest = $env:SCCACHE_BIN_DIR
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $asset = "sccache-$version-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/mozilla/sccache/releases/download/$version/$asset"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Write-Host "==> Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $exe = Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Filter 'sccache.exe' |
            Select-Object -First 1
          if (-not $exe) { throw "sccache.exe not found in $asset" }
          Copy-Item -Force $exe.FullName (Join-Path $dest 'sccache.exe')
          & (Join-Path $dest 'sccache.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "sccache --version failed ($LASTEXITCODE)" }

      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Build deps
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
        run: .\ci\windows\scripts\build-deps.ps1

      - name: Build xSTUDIO
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
          CMAKE_C_COMPILER_LAUNCHER: ${{ env.SCCACHE_BIN_DIR }}/sccache.exe
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ env.SCCACHE_BIN_DIR }}/sccache.exe
        run: .\ci\windows\scripts\build-xstudio.ps1

      - name: sccache stats
        if: always()
        shell: pwsh
        run: |
          & (Join-Path $env:SCCACHE_BIN_DIR 'sccache.exe') --show-stats
